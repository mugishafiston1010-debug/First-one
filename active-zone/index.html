<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- app:start -->
<title>Активная зона</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Math&family=Unbounded:wght@500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/temml@0.13.5/dist/temml.min.js"></script>
<style>
/* Layout: one working column. The reactor-pool card (navy with a Cherenkov-blue glow) is the
   only loud object: it holds the game stage. Rooms are quiet surfaces with a coloured room mark. */
:root {
  --bg: #EDF2F7;
  --surface: #FFFFFF;
  --tint: #F4F7FB;
  --ink: #0C1A2C;
  --muted: #56677E;
  --line: #D3DCE8;
  --accent: #0A58C4;
  --accent-ink: #FFFFFF;
  --pool: #071A33;
  --pool-ink: #EAF4FF;
  --pool-muted: #8FB0D4;
  --glow: #1C8DFF;
  --bad: #C2352A;
  --warn: #A86400;
  --good: #1B8348;
  --r-math: #5B4BD6;
  --r-phys: #0A7FB8;
  --r-chem: #1B8348;
  --r-mech: #B5530C;
  --font-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-math: "Noto Sans Math", "Cambria Math", "STIX Two Math", math;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #050E1A; --surface: #0B1A2D; --tint: #0E2036; --ink: #E3EDF8; --muted: #8A9EB6; --line: #1B2F47;
    --accent: #56B4FF; --accent-ink: #04121F;
    --pool: #08203F; --pool-ink: #EAF4FF; --pool-muted: #8FB0D4; --glow: #2A9BFF;
    --bad: #FF7F72; --warn: #F0B04A; --good: #4CC98A;
    --r-math: #A99BFF; --r-phys: #4FC3F7; --r-chem: #4CC98A; --r-mech: #F5A35C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #050E1A; --surface: #0B1A2D; --tint: #0E2036; --ink: #E3EDF8; --muted: #8A9EB6; --line: #1B2F47;
  --accent: #56B4FF; --accent-ink: #04121F;
  --pool: #08203F; --pool-ink: #EAF4FF; --pool-muted: #8FB0D4; --glow: #2A9BFF;
  --bad: #FF7F72; --warn: #F0B04A; --good: #4CC98A;
  --r-math: #A99BFF; --r-phys: #4FC3F7; --r-chem: #4CC98A; --r-mech: #F5A35C;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
math { font-family: var(--font-math); font-size: 1.12em; }
math .gap { border: 1.5px dashed currentColor; border-radius: 6px; padding: 0 3px; opacity: 0.9; }
math .gapok { color: var(--good); }
.pool math .gapok { color: #6EE7A8; }

.wrap {
  max-width: 760px; margin: 0 auto;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px;
}
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.brand h1 { margin: 0; font: 700 1.5rem/1.1 var(--font-display); letter-spacing: -0.01em; }
.brand p { margin: 0; color: var(--muted); font-size: 0.875rem; }
.status { display: flex; gap: 14px; font: 500 0.75rem/1 var(--font-mono); color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.status b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 10px 14px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

.view { display: flex; flex-direction: column; gap: 16px; }
.label { font: 500 0.6875rem/1.2 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h2 { margin: 0; font: 600 1.125rem/1.3 var(--font-body); text-wrap: balance; }
h3 { margin: 0; font: 600 1rem/1.3 var(--font-body); text-wrap: balance; }
.hint { color: var(--muted); font-size: 0.875rem; margin: 0; max-width: 65ch; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; padding: 3px; background: var(--surface); flex-wrap: wrap; }
.seg button { background: none; border: 0; border-radius: 7px; padding: 5px 12px; font-size: 0.8125rem; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; color: var(--muted); font-size: 0.875rem; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rc, var(--muted)); opacity: 0.45; }
.chip[aria-pressed="true"] { background: var(--surface); border-color: var(--rc, var(--accent)); color: var(--ink); }
.chip[aria-pressed="true"] .dot { opacity: 1; }
.r-math { --rc: var(--r-math); } .r-phys { --rc: var(--r-phys); } .r-chem { --rc: var(--r-chem); } .r-mech { --rc: var(--r-mech); }

.btn { background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); border-radius: 12px; padding: 11px 18px; font-weight: 600; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }
.btn.ghost:hover { border-color: var(--muted); filter: none; }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.small { padding: 7px 12px; font-size: 0.875rem; border-radius: 10px; }
kbd { font: 400 0.6875rem/1 var(--font-mono); opacity: 0.7; margin-left: 8px; }
@media (hover: none) { kbd, .keys { display: none !important; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }

/* Rooms */
.rooms { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .rooms { grid-template-columns: 1fr; } }
.room { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; position: relative; overflow: hidden; }
.room::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--rc); }
.room:hover { border-color: var(--rc); }
.room .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.room .name { font: 500 1.0625rem/1.2 var(--font-display); }
.room .count { font: 500 0.75rem/1 var(--font-mono); color: var(--muted); white-space: nowrap; }
.room .sub { color: var(--muted); font-size: 0.875rem; margin: 0; }
.room .tip { margin: 0; font-size: 0.875rem; border-top: 1px solid var(--line); padding-top: 10px; }
.room .tip b { color: var(--rc); font-weight: 600; }
.stack { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); gap: 2px; }
.stack i { display: block; min-width: 0; }
.c-new { background: var(--line); } .c-learning { background: var(--warn); } .c-maturing { background: var(--accent); } .c-stable { background: var(--good); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.8125rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.legend i.c-new { background: var(--muted); opacity: 0.5; }
.legend b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }

.roomhead { display: flex; flex-direction: column; gap: 10px; padding-left: 14px; border-left: 4px solid var(--rc); }
.back { align-self: flex-start; background: none; border: 0; padding: 0; color: var(--accent); font-weight: 500; font-size: 0.875rem; }
.tipbox { background: var(--tint); border-radius: 12px; padding: 12px 14px; font-size: 0.9375rem; }
.tipbox .label { color: var(--rc); display: block; margin-bottom: 4px; }
.topic { display: flex; flex-direction: column; gap: 10px; }
.topic > .label { padding-top: 6px; }
.fcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.fcard .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.fcard h3 { min-width: 0; }
.formula { background: var(--tint); border-radius: 12px; padding: 14px 12px; overflow-x: auto; text-align: center; font-size: 1.15rem; position: relative; }
.formula.veiled math { filter: blur(9px); opacity: 0.55; }
.formula .reveal { position: absolute; inset: 0; margin: auto; width: max-content; height: max-content; }
.facts { display: grid; gap: 8px; margin: 0; }
.facts div { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 10px; font-size: 0.9375rem; }
.facts dt { font: 500 0.6875rem/1.9 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 0; min-width: 0; }
.facts .trap dt { color: var(--bad); }
.facts .npp dt { color: var(--accent); }
@media (max-width: 520px) { .facts div { grid-template-columns: 1fr; gap: 0; } }
.pill { font: 500 0.6875rem/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; padding: 5px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; color: var(--muted); }
.pill.s-learning { color: var(--warn); } .pill.s-maturing { color: var(--accent); } .pill.s-stable { color: var(--good); }

/* Games */
.games { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .games { grid-template-columns: 1fr; } }
.game { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.game:hover { border-color: var(--accent); }
.game.hero { grid-column: 1 / -1; background: radial-gradient(110% 120% at 100% 120%, var(--glow) 0%, transparent 55%), var(--pool); color: var(--pool-ink); border-color: transparent; }
.game.hero .hint, .game.hero .best { color: var(--pool-muted); }
.game .name { font: 500 1.0625rem/1.2 var(--font-display); }
.game .best { font: 500 0.75rem/1 var(--font-mono); color: var(--muted); }
.game:disabled { opacity: 0.5; cursor: not-allowed; }

.stage {
  position: relative;
  background: radial-gradient(120% 85% at 50% 118%, var(--glow) 0%, transparent 62%), var(--pool);
  color: var(--pool-ink); border-radius: 22px; padding: clamp(18px, 4vw, 30px);
  display: flex; flex-direction: column; gap: 18px; overflow: hidden; min-height: 320px;
}
.stage .label { color: var(--pool-muted); }
.hud { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.hud .cell { display: flex; flex-direction: column; gap: 4px; }
.hud b { font: 500 1.25rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.hud .crit b { color: #FF9A8F; }
.rho { display: flex; flex-direction: column; gap: 6px; }
.rho .bar { position: relative; height: 10px; border-radius: 5px; background: rgba(234, 244, 255, 0.12); overflow: hidden; }
.rho .bar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #4CC98A, #F0B04A 60%, #FF7F72); transition: width 0.3s ease; }
.rho .scale { display: flex; justify-content: space-between; font: 400 0.6875rem/1 var(--font-mono); color: var(--pool-muted); }
.timer { height: 4px; border-radius: 2px; background: rgba(234, 244, 255, 0.14); overflow: hidden; }
.timer i { display: block; height: 100%; background: var(--pool-ink); }
.timer.low i { background: #FF9A8F; }
.q { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.q .ask { margin: 0; font-size: 0.9375rem; color: var(--pool-muted); }
.q .big { font-size: clamp(1.15rem, 3.6vw, 1.6rem); overflow-x: auto; padding-block: 6px; text-align: center; }
.q .unitq { margin: 0; font: 600 clamp(1.3rem, 4.4vw, 1.8rem)/1.2 var(--font-body); text-wrap: balance; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.opt {
  background: rgba(234, 244, 255, 0.07); border: 1px solid rgba(234, 244, 255, 0.22); color: var(--pool-ink);
  border-radius: 12px; padding: 12px 10px; min-height: 56px; display: flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 1rem; overflow-x: auto; min-width: 0;
}
.opt:hover:not(:disabled) { background: rgba(234, 244, 255, 0.14); border-color: rgba(234, 244, 255, 0.5); }
.opt .k { font: 400 0.6875rem/1 var(--font-mono); color: var(--pool-muted); }
.opt.right { border-color: #6EE7A8; background: rgba(76, 201, 138, 0.18); }
.opt.wrong { border-color: #FF9A8F; background: rgba(255, 127, 114, 0.18); }
.opt:disabled { cursor: default; }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tf .opt { font-weight: 600; min-height: 64px; }
.fb { border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; background: rgba(234, 244, 255, 0.08); border: 1px solid rgba(234, 244, 255, 0.18); }
.fb.ok { border-color: rgba(110, 231, 168, 0.6); }
.fb.no { border-color: rgba(255, 154, 143, 0.6); }
.fb strong.ok { color: #6EE7A8; } .fb strong.no { color: #FF9A8F; }
.fb p { margin: 0; font-size: 0.9375rem; }
.fb .muted { color: var(--pool-muted); }
.fb .f { overflow-x: auto; text-align: center; font-size: 1.1rem; padding-block: 4px; }
.stage .btn { background: var(--pool-ink); color: var(--pool); border-color: var(--pool-ink); }
.stage .btn.ghost { background: transparent; color: var(--pool-ink); border-color: rgba(234, 244, 255, 0.35); }
.flash { position: absolute; right: 18px; top: 18px; font: 500 0.875rem/1 var(--font-mono); color: #6EE7A8; animation: up 0.7s ease both; }
@keyframes up { from { opacity: 0; transform: translateY(6px); } 30% { opacity: 1; } to { opacity: 0; transform: translateY(-14px); } }
.scram { animation: scram 0.5s ease 2; }
@keyframes scram { 50% { box-shadow: inset 0 0 0 3px #FF7F72; } }
@media (prefers-reduced-motion: reduce) { .flash, .scram { animation: none; } .rho .bar i { transition: none; } }
.endlist { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.endlist li { display: flex; justify-content: space-between; gap: 10px; font-size: 0.9375rem; border-top: 1px solid rgba(234, 244, 255, 0.14); padding-top: 8px; }
.endlist li span:last-child { color: var(--pool-muted); white-space: nowrap; }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); min-width: 0; }
.tile b { font: 500 1.5rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.roomrow { display: grid; grid-template-columns: 7rem minmax(0, 1fr) 4rem; gap: 12px; align-items: center; font-size: 0.9375rem; }
.roomrow span:last-child { text-align: right; font: 500 0.8125rem/1 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.roomrow .stack { height: 10px; }
textarea { background: var(--tint); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; width: 100%; resize: vertical; min-height: 90px; font: 400 0.8125rem/1.4 var(--font-mono); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 0.875rem; max-width: calc(100% - 32px); z-index: 20; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Активная зона</h1>
      <p>Формулы 2-го курса АЭС: запомнить один раз и навсегда</p>
    </div>
    <div class="status" aria-live="polite">
      <span>К повтору <b id="st-due">0</b></span>
      <span>Серия <b id="st-streak">0</b></span>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Разделы">
    <button role="tab" data-tab="rooms" id="tab-rooms" aria-selected="true">Аудитории</button>
    <button role="tab" data-tab="games" id="tab-games" aria-selected="false">Игры</button>
    <button role="tab" data-tab="progress" id="tab-progress" aria-selected="false">Прогресс</button>
  </nav>

  <div class="row" id="where">
    <div class="seg" id="seg-sem" role="group" aria-label="Семестр">
      <button data-v="3">3 семестр</button><button data-v="4">4 семестр</button><button data-v="0">Все темы</button>
    </div>
    <span class="hint" id="sem-note"></span>
  </div>

  <section class="view" id="view-rooms" aria-labelledby="tab-rooms"></section>
  <section class="view" id="view-games" aria-labelledby="tab-games" hidden></section>
  <section class="view" id="view-progress" aria-labelledby="tab-progress" hidden></section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(() => {
'use strict';
const T = String.raw;

/* ======================= CONTENT ======================= */
const ROOMS = [
  { id: 'math', name: 'Математика', sub: 'Кратные и криволинейные интегралы, теория поля, ряды, ДУ, ТФКП, вероятность' },
  { id: 'phys', name: 'Физика', sub: 'Электричество и магнетизм, колебания, оптика, квантовая и ядерная физика' },
  { id: 'chem', name: 'Химия', sub: 'Термодинамика, равновесие, кинетика, растворы, электрохимия' },
  { id: 'mech', name: 'Механика', sub: 'Статика, кинематика, динамика, Лагранж, сопротивление материалов' },
];

/* \gap marks the blank in a fill-in question */
const CARDS = [
/* ---------- МАТЕМАТИКА ---------- */
{ id: 'm1', r: 'math', s: 3, topic: 'Кратные интегралы', name: 'Двойной интеграл в полярных координатах',
  tex: T`\iint_D f(x,y)\,dx\,dy=\iint_{D'} f(r\cos\varphi,\,r\sin\varphi)\,r\,dr\,d\varphi`,
  hook: 'Якобиан равен r. Клетка полярной сетки — кусочек кольца: ширина dr, длина дуги r·dφ. Чем дальше от центра, тем клетка больше.',
  npp: 'Средняя мощность по сечению цилиндрической активной зоны: интегрируют по кругу именно так.',
  trap: 'Забыть множитель r. Самая частая потеря баллов на контрольной.',
  gap: { tex: T`\iint_D f\,dx\,dy=\iint_{D'} f(r\cos\varphi,\,r\sin\varphi)\,\gap\,dr\,d\varphi`, a: T`r`, o: [T`r^2`, T`1`, T`\varphi`] },
  bad: [{ tex: T`\iint_D f(x,y)\,dx\,dy=\iint_{D'} f(r\cos\varphi,\,r\sin\varphi)\,dr\,d\varphi`, why: 'Пропущен якобиан r.' },
        { tex: T`\iint_D f(x,y)\,dx\,dy=\iint_{D'} f(r\cos\varphi,\,r\sin\varphi)\,r^2\,dr\,d\varphi`, why: 'r² бывает в сферических координатах (r² sin θ), а в полярных якобиан r.' }] },
{ id: 'm2', r: 'math', s: 3, topic: 'Кратные интегралы', name: 'Элемент объёма в сферических координатах',
  tex: T`dV=r^2\sin\theta\,dr\,d\theta\,d\varphi`,
  hook: 'Кусочек глобуса: r·dθ вдоль меридиана, r·sin θ·dφ вдоль параллели, dr в толщину. Перемножь три стороны: «эр-квадрат-синус-тэта».',
  npp: 'Поток от точечного источника нейтронов, масса сферической топливной микросферы.',
  trap: 'Если θ отсчитан от оси z, нужен sin θ, а не cos θ: на полюсе клетка вырождается в точку.',
  gap: { tex: T`dV=\gap\,dr\,d\theta\,d\varphi`, a: T`r^2\sin\theta`, o: [T`r\sin\theta`, T`r^2\cos\theta`, T`r^2`] },
  bad: [{ tex: T`dV=r\sin\theta\,dr\,d\theta\,d\varphi`, why: 'Потерян один r: обе угловые стороны клетки содержат r.' },
        { tex: T`dV=r^2\cos\theta\,dr\,d\theta\,d\varphi`, why: 'При θ от оси z нужен sin θ.' }] },
{ id: 'm3', r: 'math', s: 3, topic: 'Криволинейные интегралы', name: 'Формула Грина',
  tex: T`\oint_L P\,dx+Q\,dy=\iint_D\left(\frac{\partial Q}{\partial x}-\frac{\partial P}{\partial y}\right)dx\,dy`,
  hook: '«Ку по икс минус Пэ по игрек»: буквы перекрещиваются. Q стоит при dy, а дифференцируется по x.',
  npp: 'Площадь сечения по контуру: S = ½∮(x dy − y dx). Так CAD считает площади сечений труб и каналов.',
  trap: 'Обход против часовой стрелки (область слева). При обходе по часовой знак меняется.',
  gap: { tex: T`\oint_L P\,dx+Q\,dy=\iint_D\left(\gap-\frac{\partial P}{\partial y}\right)dx\,dy`, a: T`\frac{\partial Q}{\partial x}`, o: [T`\frac{\partial P}{\partial x}`, T`\frac{\partial Q}{\partial y}`, T`\frac{\partial P}{\partial y}`] },
  bad: [{ tex: T`\oint_L P\,dx+Q\,dy=\iint_D\left(\frac{\partial P}{\partial y}-\frac{\partial Q}{\partial x}\right)dx\,dy`, why: 'Знак перевёрнут: так было бы при обходе по часовой стрелке.' }] },
{ id: 'm4', r: 'math', s: 3, topic: 'Теория поля', name: 'Теорема Остроградского–Гаусса',
  tex: T`\oiint_S \vec F\cdot d\vec S=\iiint_V \operatorname{div}\vec F\,dV`,
  hook: '«Сколько вытекло через стенки, столько родилось внутри». div — плотность источников.',
  npp: 'Так выводят уравнение баланса нейтронов и уравнение теплопроводности: утечка через поверхность равна источникам в объёме.',
  trap: 'Поверхность замкнутая, нормаль внешняя.',
  gap: { tex: T`\oiint_S \vec F\cdot d\vec S=\iiint_V \gap\,dV`, a: T`\operatorname{div}\vec F`, o: [T`\operatorname{rot}\vec F`, T`|\vec F|`, T`\nabla^2\vec F`] },
  bad: [{ tex: T`\oiint_S \vec F\cdot d\vec S=\iiint_V \operatorname{rot}\vec F\,dV`, why: 'rot — из формулы Стокса (контур и поверхность). Для объёма нужна div.' }] },
{ id: 'm5', r: 'math', s: 3, topic: 'Теория поля', name: 'Формула Стокса',
  tex: T`\oint_L \vec F\cdot d\vec l=\iint_S \operatorname{rot}\vec F\cdot d\vec S`,
  hook: 'Циркуляция по краю равна сумме «вихрей» на натянутой на край плёнке. Формула Грина — это Стокс на плоскости.',
  npp: 'Из неё следует закон полного тока ∮H·dl = I: ток в шинах генератора создаёт магнитное поле вокруг.',
  trap: 'Обход L и нормаль S связаны правилом правого винта.',
  gap: { tex: T`\oint_L \vec F\cdot d\vec l=\iint_S \gap\cdot d\vec S`, a: T`\operatorname{rot}\vec F`, o: [T`\operatorname{div}\vec F`, T`\vec F`, T`\nabla^2\vec F`] },
  bad: [{ tex: T`\oint_L \vec F\cdot d\vec l=\iiint_V \operatorname{rot}\vec F\,dV`, why: 'Контур ограничивает поверхность, а не объём.' }] },
{ id: 'm6', r: 'math', s: 3, topic: 'Ряды', name: 'Признак Даламбера',
  tex: T`q=\lim_{n\to\infty}\left|\frac{a_{n+1}}{a_n}\right|:\quad q<1\Rightarrow\text{сходится},\;\;q>1\Rightarrow\text{расходится}`,
  hook: 'Даламбер любит факториалы и показательные функции: n! и 3ⁿ красиво сокращаются в отношении. При q = 1 признак молчит.',
  npp: 'Сходимость рядов по собственным функциям при решении уравнения диффузии нейтронов проверяют так.',
  trap: 'q = 1 ничего не доказывает: и Σ1/n (расходится), и Σ1/n² (сходится) дают q = 1.',
  gap: { tex: T`q=\lim_{n\to\infty}\left|\frac{\gap}{a_n}\right|`, a: T`a_{n+1}`, o: [T`a_{n-1}`, T`a_{2n}`, T`n\,a_n`] },
  bad: [{ tex: T`q=\lim_{n\to\infty}\left|\frac{a_{n+1}}{a_n}\right|:\quad q>1\Rightarrow\text{сходится}`, why: 'Наоборот: при q > 1 члены растут, ряд расходится.' }] },
{ id: 'm7', r: 'math', s: 3, topic: 'Ряды', name: 'Ряд Маклорена',
  tex: T`f(x)=\sum_{n=0}^{\infty}\frac{f^{(n)}(0)}{n!}\,x^n`,
  hook: '«Производная в нуле на факториал». Каждый следующий член подгоняет ещё одну производную графика в точке 0.',
  npp: 'Линеаризация: при малых x оставляют 1–2 члена. Так получают e^(−Σx) ≈ 1 − Σx для тонкого слоя защиты.',
  trap: 'В знаменателе n!, а производная берётся в точке 0, а не в x.',
  gap: { tex: T`f(x)=\sum_{n=0}^{\infty}\frac{f^{(n)}(0)}{\gap}\,x^n`, a: T`n!`, o: [T`n`, T`(n+1)!`, T`2^n`] },
  bad: [{ tex: T`f(x)=\sum_{n=0}^{\infty}\frac{f^{(n)}(x)}{n!}\,x^n`, why: 'Производная должна быть в центре разложения, в точке 0.' }] },
{ id: 'm8', r: 'math', s: 3, topic: 'Ряды', name: 'Ряд для sin x',
  tex: T`\sin x=x-\frac{x^3}{3!}+\frac{x^5}{5!}-\dots`,
  hook: 'Синус нечётный, поэтому только нечётные степени. Косинус чётный: 1 − x²/2! + x⁴/4! − … У eˣ все знаки плюс.',
  npp: 'sin x ≈ x при малых углах: так линеаризуют уравнения маятника и колебаний трубок парогенератора.',
  trap: 'У sin x нет члена x². Знаки чередуются.',
  gap: { tex: T`\sin x=x-\frac{x^3}{\gap}+\frac{x^5}{5!}-\dots`, a: T`3!`, o: [T`3`, T`2!`, T`2`] },
  bad: [{ tex: T`\sin x=1-\frac{x^2}{2!}+\frac{x^4}{4!}-\dots`, why: 'Это ряд для cos x.' }] },
{ id: 'm9', r: 'math', s: 3, topic: 'Дифференциальные уравнения', name: 'ЛОДУ 2-го порядка: комплексные корни',
  tex: T`k_{1,2}=\alpha\pm i\beta\;\Rightarrow\;y=e^{\alpha x}\left(C_1\cos\beta x+C_2\sin\beta x\right)`,
  hook: 'α — затухание (огибающая), β — частота. Комплексные корни означают колебания.',
  npp: 'Затухающие колебания давления в компенсаторе давления и мощности реактора описываются этим решением.',
  trap: 'В экспоненте α, внутри cos и sin β. Не наоборот.',
  gap: { tex: T`y=e^{\gap}\left(C_1\cos\beta x+C_2\sin\beta x\right)`, a: T`\alpha x`, o: [T`\beta x`, T`-\alpha x`, T`x`] },
  bad: [{ tex: T`k_{1,2}=\alpha\pm i\beta\;\Rightarrow\;y=e^{\beta x}\left(C_1\cos\alpha x+C_2\sin\alpha x\right)`, why: 'α и β перепутаны.' }] },
{ id: 'm10', r: 'math', s: 3, topic: 'Дифференциальные уравнения', name: 'Кратный корень характеристического уравнения',
  tex: T`k_1=k_2=k\;\Rightarrow\;y=(C_1+C_2x)\,e^{kx}`,
  hook: 'Два одинаковых корня дали бы одно и то же решение. Умножь второе на x, чтобы они «разошлись».',
  npp: 'Критическое демпфирование: система регулирования возвращается к норме быстрее всего и без колебаний.',
  trap: 'C₁e^{kx} + C₂e^{kx} — это одно решение, а нужно два независимых.',
  gap: { tex: T`y=(C_1+\gap)\,e^{kx}`, a: T`C_2x`, o: [T`C_2`, T`C_2x^2`, T`C_2e^{x}`] },
  bad: [{ tex: T`k_1=k_2=k\;\Rightarrow\;y=C_1e^{kx}+C_2e^{kx}`, why: 'Это одно решение. Второе — x·e^{kx}.' }] },
{ id: 'm11', r: 'math', s: 3, topic: 'Дифференциальные уравнения', name: 'Линейное ДУ 1-го порядка: накопление изотопа',
  tex: T`\frac{dN}{dt}=Q-\lambda N,\;N(0)=0\;\Rightarrow\;N(t)=\frac{Q}{\lambda}\left(1-e^{-\lambda t}\right)`,
  hook: 'Ведро с дыркой: приток Q, утечка λN. Уровень растёт и выходит на «полку» Q/λ.',
  npp: 'Так накапливается любой изотоп при облучении: насыщение наступает через несколько периодов полураспада.',
  trap: 'При t → ∞ ответ Q/λ, а не бесконечность. Проверяй предел.',
  gap: { tex: T`N(t)=\frac{Q}{\lambda}\left(1-\gap\right)`, a: T`e^{-\lambda t}`, o: [T`e^{\lambda t}`, T`\lambda t`, T`e^{-t/\lambda}`] },
  bad: [{ tex: T`\frac{dN}{dt}=Q-\lambda N,\;N(0)=0\;\Rightarrow\;N(t)=\frac{Q}{\lambda}e^{-\lambda t}`, why: 'Это убывание, а при N(0) = 0 количество растёт.' }] },
{ id: 'm12', r: 'math', s: 4, topic: 'Ряды Фурье', name: 'Коэффициенты Фурье',
  tex: T`a_n=\frac{1}{\pi}\int_{-\pi}^{\pi}f(x)\cos nx\,dx,\qquad b_n=\frac{1}{\pi}\int_{-\pi}^{\pi}f(x)\sin nx\,dx`,
  hook: '«Проекция на гармонику»: умножь на cos nx и усредни. a₀/2 — просто среднее значение функции.',
  npp: 'Разложение распределения нейтронного потока и температуры по гармоникам при решении уравнений в частных производных.',
  trap: 'Для чётной f все bₙ = 0, для нечётной все aₙ = 0. Проверь чётность до счёта.',
  gap: { tex: T`a_n=\gap\int_{-\pi}^{\pi}f(x)\cos nx\,dx`, a: T`\frac{1}{\pi}`, o: [T`\frac{1}{2\pi}`, T`\pi`, T`\frac{2}{\pi}`] },
  bad: [{ tex: T`a_n=\frac{1}{\pi}\int_{-\pi}^{\pi}f(x)\sin nx\,dx`, why: 'aₙ — при косинусе, bₙ — при синусе.' }] },
{ id: 'm13', r: 'math', s: 4, topic: 'ТФКП', name: 'Формула Эйлера',
  tex: T`e^{i\varphi}=\cos\varphi+i\sin\varphi`,
  hook: 'Точка на единичной окружности: cos — по горизонтали, sin — по вертикали. При φ = π получается e^{iπ} + 1 = 0.',
  npp: 'Переменный ток и колебания пишут как Re(A·e^{iωt}): производная превращается в умножение на iω.',
  trap: 'i стоит при sin, а не при cos.',
  gap: { tex: T`e^{i\varphi}=\cos\varphi+\gap`, a: T`i\sin\varphi`, o: [T`\sin\varphi`, T`-i\sin\varphi`, T`i\cos\varphi`] },
  bad: [{ tex: T`e^{i\varphi}=\sin\varphi+i\cos\varphi`, why: 'cos и sin поменяли местами: при φ = 0 должно получиться 1.' }] },
{ id: 'm14', r: 'math', s: 4, topic: 'Теория вероятностей', name: 'Распределение Пуассона',
  tex: T`P(k)=\frac{\lambda^k e^{-\lambda}}{k!}`,
  hook: '«Лямбда в степени k, е в минус лямбда, на k факториал». Редкие независимые события: распады, отказы.',
  npp: 'Число отсчётов детектора за время t распределено по Пуассону: среднее λ, дисперсия тоже λ, погрешность счёта √N.',
  trap: 'Матожидание и дисперсия обе равны λ.',
  gap: { tex: T`P(k)=\frac{\lambda^k\,\gap}{k!}`, a: T`e^{-\lambda}`, o: [T`e^{\lambda}`, T`e^{-k}`, T`\lambda^{-k}`] },
  bad: [{ tex: T`P(k)=\frac{\lambda^k e^{-\lambda}}{k}`, why: 'В знаменателе k!, иначе сумма вероятностей не равна 1.' }] },

{ id: 'p1', r: 'phys', s: 3, topic: 'Электростатика', name: 'Закон Кулона',
  tex: T`F=k\,\frac{|q_1q_2|}{\varepsilon r^2},\qquad k=\frac{1}{4\pi\varepsilon_0}\approx 9\cdot10^{9}\ \frac{\text{Н·м}^2}{\text{Кл}^2}`,
  hook: 'Та же форма, что у тяготения Gm₁m₂/r², только заряды вместо масс. «Девять на десять в девятой».',
  npp: 'Кулоновский барьер: протону трудно подойти к ядру, а нейтрон без заряда входит свободно. Поэтому реактор работает на нейтронах.',
  trap: 'r в квадрате. ε среды в знаменателе: в воде (ε ≈ 81) сила в 81 раз слабее.',
  gap: { tex: T`F=k\,\frac{|q_1q_2|}{\varepsilon\,\gap}`, a: T`r^2`, o: [T`r`, T`r^3`, T`\sqrt r`] },
  bad: [{ tex: T`F=k\,\frac{|q_1q_2|}{\varepsilon r}`, why: 'Расстояние должно быть в квадрате.' }] },
{ id: 'p2', r: 'phys', s: 3, topic: 'Электростатика', name: 'Теорема Гаусса',
  tex: T`\oiint_S \vec E\cdot d\vec S=\frac{q_{\text{внутр}}}{\varepsilon_0}`,
  hook: 'Поток через замкнутую поверхность считает только заряды внутри. Внешние линии входят и выходят, их вклад ноль.',
  npp: 'Поле нити, цилиндра, сферы получается в одну строку: так считают ионизационные камеры и кабели.',
  trap: 'На ε₀ делят, а не умножают. Заряды снаружи не учитывают.',
  gap: { tex: T`\oiint_S \vec E\cdot d\vec S=\frac{q_{\text{внутр}}}{\gap}`, a: T`\varepsilon_0`, o: [T`4\pi\varepsilon_0`, T`\mu_0`, T`4\pi`] },
  bad: [{ tex: T`\oiint_S \vec E\cdot d\vec S=q_{\text{внутр}}\,\varepsilon_0`, why: 'ε₀ стоит в знаменателе.' }] },
{ id: 'p3', r: 'phys', s: 3, topic: 'Электростатика', name: 'Плоский конденсатор и его энергия',
  tex: T`C=\frac{\varepsilon\varepsilon_0 S}{d},\qquad W=\frac{CU^2}{2}`,
  hook: 'Больше пластины — больше места для заряда; больше зазор — слабее связь. Энергия «по-квадратному», как mv²/2 и kx²/2.',
  npp: 'Ёмкостные датчики уровня: у воды ε ≈ 81, у пара ≈ 1, на границе ёмкость резко меняется.',
  trap: 'd в знаменателе, и W = CU²/2, а не CU².',
  gap: { tex: T`C=\frac{\varepsilon\varepsilon_0 S}{\gap}`, a: T`d`, o: [T`d^2`, T`S`, T`4\pi d`] },
  bad: [{ tex: T`C=\frac{\varepsilon\varepsilon_0 d}{S},\qquad W=\frac{CU^2}{2}`, why: 'Перевёрнуто: ёмкость растёт с площадью и падает с зазором.' },
        { tex: T`C=\frac{\varepsilon\varepsilon_0 S}{d},\qquad W=CU^2`, why: 'Потеряна двойка в энергии.' }] },
{ id: 'p4', r: 'phys', s: 3, topic: 'Постоянный ток', name: 'Закон Ома в дифференциальной форме',
  tex: T`\vec j=\sigma\vec E=\frac{\vec E}{\rho}`,
  hook: '«Жэ равно сигма Е»: плотность тока = проводимость × поле. Проинтегрируй по проводу — получишь I = U/R.',
  npp: 'Тепло в проводнике w = jE = j²/σ. Так считают нагрев токоподводов и электронагревателей компенсатора давления.',
  trap: 'σ — проводимость (См/м), ρ = 1/σ — удельное сопротивление.',
  gap: { tex: T`\vec j=\gap\,\vec E`, a: T`\sigma`, o: [T`\rho`, T`\varepsilon_0`, T`\mu`] },
  bad: [{ tex: T`\vec j=\rho\vec E`, why: 'ρ — сопротивление: правильно j = E/ρ = σE.' }] },
{ id: 'p5', r: 'phys', s: 3, topic: 'Магнитное поле', name: 'Поле прямого тока',
  tex: T`B=\frac{\mu_0 I}{2\pi r}`,
  hook: '2πr — длина окружности вокруг провода, циркуляция B по ней равна μ₀I. Отсюда формула за 5 секунд.',
  npp: 'Электродинамические силы между шинами генератора при коротком замыкании: F/l = μ₀I₁I₂/(2πd).',
  trap: 'r в первой степени: провод бесконечный, а не точка.',
  gap: { tex: T`B=\frac{\mu_0 I}{\gap}`, a: T`2\pi r`, o: [T`4\pi r^2`, T`2r`, T`\pi r^2`] },
  bad: [{ tex: T`B=\frac{\mu_0 I}{4\pi r^2}`, why: 'Так спадает поле точечного источника. У бесконечного провода 2πr.' }] },
{ id: 'p6', r: 'phys', s: 3, topic: 'Магнитное поле', name: 'Сила Лоренца и радиус орбиты',
  tex: T`\vec F=q\vec E+q\left[\vec v\times\vec B\right],\qquad R=\frac{mv}{|q|B}`,
  hook: 'Магнитная сила всегда перпендикулярна скорости: работы не совершает, только поворачивает. Тяжелее частица — больше радиус.',
  npp: 'Электромагнитное разделение изотопов: ²³⁵U и ²³⁸U в одном поле летят по разным радиусам.',
  trap: 'Магнитное поле не меняет энергию частицы, только направление скорости.',
  gap: { tex: T`R=\frac{\gap}{|q|B}`, a: T`mv`, o: [T`qv`, T`m`, T`mv^2`] },
  bad: [{ tex: T`\vec F=q\vec E+q\left[\vec v\times\vec B\right],\qquad R=\frac{|q|B}{mv}`, why: 'Перевёрнуто: чем больше импульс, тем больше радиус.' }] },
{ id: 'p7', r: 'phys', s: 3, topic: 'Электромагнитная индукция', name: 'Закон Фарадея',
  tex: T`\mathcal{E}_i=-\frac{d\Phi}{dt}`,
  hook: 'Минус — это правило Ленца: индукционный ток мешает изменению потока. «Природа упрямая».',
  npp: 'Турбогенератор АЭС: вращающийся ротор меняет поток через обмотки статора, получается 50 Гц.',
  trap: 'ЭДС зависит от скорости изменения потока, а не от самого потока.',
  gap: { tex: T`\mathcal{E}_i=-\frac{\gap}{dt}`, a: T`d\Phi`, o: [T`\Phi`, T`dB`, T`dI`] },
  bad: [{ tex: T`\mathcal{E}_i=\frac{\Phi}{t}`, why: 'Нужна производная потока, и со знаком минус.' }] },
{ id: 'p8', r: 'phys', s: 3, topic: 'Электромагнитная индукция', name: 'Энергия магнитного поля',
  tex: T`W=\frac{LI^2}{2},\qquad w=\frac{B^2}{2\mu_0}`,
  hook: 'Близнец CU²/2: индуктивность играет роль массы, ток — скорости. Всё квадратичное делится на 2.',
  npp: 'При разрыве цепи с большой L энергия LI²/2 уходит в дугу. Поэтому у генераторных выключателей дугогашение.',
  trap: 'В плотности энергии μ₀ в знаменателе.',
  gap: { tex: T`W=\frac{L\,\gap}{2}`, a: T`I^2`, o: [T`I`, T`U^2`, T`\Phi`] },
  bad: [{ tex: T`W=LI^2,\qquad w=\frac{B^2}{2\mu_0}`, why: 'Потеряна двойка.' },
        { tex: T`W=\frac{LI^2}{2},\qquad w=\frac{\mu_0B^2}{2}`, why: 'μ₀ в знаменателе: w = B²/(2μ₀).' }] },
{ id: 'p9', r: 'phys', s: 3, topic: 'Колебания', name: 'Формула Томсона',
  tex: T`\omega_0=\frac{1}{\sqrt{LC}},\qquad T=2\pi\sqrt{LC}`,
  hook: 'У пружинного маятника T = 2π√(m/k). В контуре L — «масса», 1/C — «жёсткость». Подставь и получишь Томсона.',

const KEY = 'zona.v1';
const autoSem = () => { const m = new Date().getMonth() + 1; return m >= 2 && m <= 7 ? 4 : 3; };

const valid = s => s && typeof s === 'object' && s.prog && typeof s.prog === 'object' && s.set && typeof s.set === 'object';
function hydrate(s) { const f = fresh(); return { ...f, ...s, log: s.log || {}, best: s.best || {}, set: { ...f.set, ...s.set } }; }
let S = fresh();

let dayShift = 0;
const today = () => { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 6e4) / 864e5) + dayShift; };
const dayKey = n => new Date(n * 864e5).toISOString().slice(0, 10);

/* SM-2 style scheduler. grade: 0 wrong, 2 right */
function schedule(prev, grade, t) {
  const p = prev ? { ...prev } : { e: 2.5, i: 0, r: 0, l: 0 };
  if (grade === 0) { p.e -= 0.2; p.i = 0; p.r = 0; p.l += 1; }
  else { p.i = p.r === 0 ? 1 : p.r === 1 ? Math.max(3, p.i + 1) : Math.max(p.i + 1, Math.round(p.i * p.e)); p.r += 1; }
  p.e = Math.round(Math.min(3, Math.max(1.3, p.e)) * 100) / 100;
  p.i = Math.min(p.i, 365); p.d = t + p.i;
  return p;
}
const isDue = id => { const p = S.prog[id]; return !!p && p.d <= today(); };
function record(id, ok) {
  const t = today(), p = S.prog[id];
  if (!ok) S.prog[id] = schedule(p, 0, t);
  else if (!p || p.d <= t) S.prog[id] = schedule(p, 2, t);   // a correct answer moves the card only when it is due
  const k = dayKey(t); const day = S.log[k] || (S.log[k] = { n: 0, ok: 0 });
  day.n += 1; if (ok) day.ok += 1;
}

/* ======================= HELPERS ======================= */

/* ======================= GAMES ======================= */
let G = null, tick = null, advanceTimer = null;
function poolFor(rooms) {
  const cards = CARDS.filter(c => rooms.includes(c.r) && semOk(c));
  const units = UNITS.filter(u => rooms.includes(u.r));
  return { cards, units };
}
function availableTypes(mode, pool) {
  return MODES[mode].types.filter(t => t === 'unit' ? pool.units.length : pool.cards.length);
}
function renderGames() {
  const v = $('view-games');
  if (G) return renderStage();
  const pool = poolFor(S.set.rooms);
  v.innerHTML = `<div class="chips" aria-label="Аудитории в игре">${ROOMS.map(r =>
      `<button class="chip r-${r.id}" data-groom="${r.id}" aria-pressed="${S.set.rooms.includes(r.id)}"><span class="dot"></span>${r.name}</button>`).join('')}</div>
    <div class="games">${Object.entries(MODES).map(([k, md]) => {
      const ok = availableTypes(k, pool).length > 0;
      return `<button class="game${k === 'reactor' ? ' hero' : ''}" data-play="${k}" ${ok ? '' : 'disabled'}>
        <span class="name">${md.name}</span><span class="hint">${esc(md.desc)}</span>
        <span class="best">${ok ? 'Рекорд: ' + bestText(k) : 'Нет заданий для выбранных аудиторий'}</span></button>`; }).join('')}</div>
    <p class="hint">Игры сначала дают формулы, которые пора повторить, и те, где ты ошибался. Ошибка возвращает формулу на завтра.</p>`;
}
const bestText = k => { const b = S.best[k] || 0; return k === 'reactor' ? b.toLocaleString('ru-RU') + ' МВт·ч' : k === 'trap' ? b + ' очков' : b + ' из 10'; };

function startGame(mode, only) {
  const rooms = only ? [only] : S.set.rooms;
  const pool = poolFor(rooms), types = availableTypes(mode, pool);
  if (!types.length) return toast('В выбранных аудиториях нет заданий для этой игры');
  stopTimers();
  G = { mode, only, paused: false, rooms, pool, types, recent: [], n: 0, ok: 0, score: 0, combo: 0, fixStreak: 0, rho: 0, miss: [], q: null, phase: 'ask',
        clockEnd: MODES[mode].clock ? performance.now() + MODES[mode].clock * 1000 : 0, clockLeft: 0, qEnd: 0, qLimit: 0, flash: '' };
  nextQ(); show('games');
}
function weightOf(id) {
  const p = S.prog[id];
  if (!p) return 3;
  if (p.d <= today()) return 5 + p.l;
  return p.l ? 1.5 : 0.6;
}
function pick(list) {
  const fresh = list.filter(x => !G.recent.includes(x.id));
  const from = fresh.length ? fresh : list;
  const total = from.reduce((s, x) => s + weightOf(x.id), 0);
  let r = Math.random() * total;
  for (const x of from) { r -= weightOf(x.id); if (r <= 0) return x; }
  return from[from.length - 1];
}
function makeQ() {
  const type = G.types[Math.floor(Math.random() * G.types.length)];
  if (type === 'unit') {
    const u = pick(G.pool.units);
    return { type, id: u.id, item: u, options: shuffle([u.a, ...u.o]), answer: u.a };
  }
  const c = pick(G.pool.cards);
  if (type === 'gap') return { type, id: c.id, item: c, options: shuffle([c.gap.a, ...c.gap.o]), answer: c.gap.a };
  const truth = Math.random() < 0.45 || !c.bad.length;
  const b = truth ? null : c.bad[Math.floor(Math.random() * c.bad.length)];
  return { type, id: c.id, item: c, tex: truth ? c.tex : b.tex, truth, why: b ? b.why : '' };
}
function nextQ() {
  clearTimeout(advanceTimer);
  const md = MODES[G.mode];
  if (md.count && G.n >= md.count) return endGame();
  if (md.clock && G.paused) { if (G.clockLeft <= 0) return endGame(); G.clockEnd = performance.now() + G.clockLeft; G.paused = false; }
  G.q = makeQ(); G.phase = 'ask'; G.choice = null;
  G.recent.push(G.q.id); if (G.recent.length > 6) G.recent.shift();
  if (G.mode === 'reactor') { G.qLimit = Math.max(8, 20 - G.n * 0.4) * 1000; G.qEnd = performance.now() + G.qLimit; }
  renderStage(); startTick();
}
function startTick() {
  stopTick();
  if (G.mode !== 'reactor' && !MODES[G.mode].clock) return;
  tick = setInterval(() => {
    if (!G || G.phase !== 'ask') return;
    const now = performance.now();
    if (G.mode === 'reactor') {
      const left = Math.max(0, G.qEnd - now), bar = $('qtimer');
      if (bar) { bar.firstElementChild.style.width = (left / G.qLimit * 100) + '%'; bar.classList.toggle('low', left < 3000); }
      if (left <= 0) answer(null);
    } else {
      const left = Math.max(0, G.clockEnd - now), bar = $('qtimer'), lbl = $('clock');
      if (bar) { bar.firstElementChild.style.width = (left / (MODES[G.mode].clock * 1000) * 100) + '%'; bar.classList.toggle('low', left < 10000); }
      if (lbl) lbl.textContent = Math.ceil(left / 1000) + ' с';
      if (left <= 0) endGame();
    }
  }, 100);
}
const stopTick = () => { clearInterval(tick); tick = null; };
const stopTimers = () => { stopTick(); clearTimeout(advanceTimer); };

function answer(choice) {
  if (!G || G.phase !== 'ask') return;
  const q = G.q;
  const ok = choice === null ? false : q.type === 'trap' ? choice === q.truth : choice === q.answer;
  G.choice = choice; G.n += 1; G.lastOk = ok; G.phase = ok ? 'right' : 'wrong'; G.flash = '';
  record(q.id, ok);
  if (MODES[G.mode].clock) { G.clockLeft = Math.max(0, G.clockEnd - performance.now()); G.paused = true; }
  if (ok) {
    G.ok += 1; G.combo += 1;
    if (G.mode === 'reactor') {
      const power = Math.round(NOMINAL * Math.min(1, 0.3 + 0.1 * G.combo));
      const gain = Math.round(power / 60);
      G.score += gain; G.flash = '+' + gain + ' МВт·ч';
      G.fixStreak += 1;
      if (G.fixStreak >= 5 && G.rho > 0) { G.rho = Math.max(0, G.rho - STEP); G.fixStreak = 0; G.flash = 'Стержни введены: ρ снижена'; }
    } else if (G.mode === 'trap') { const g = 1 + Math.floor(G.combo / 5); G.score += g; G.flash = '+' + g; }
    else G.score += 1;
  } else {
    G.combo = 0; G.fixStreak = 0;
    G.miss.push(q);
    if (G.mode === 'reactor') G.rho += STEP;
  }
  save(); renderStatus();
  if (G.mode === 'reactor' && G.rho >= BETA - 1e-9) { G.phase = 'wrong'; G.scram = true; }
  renderStage();

}
function endGame() {

  const prev = S.best[G.mode] || 0;
  G.record = G.score > prev;
  if (G.record) S.best[G.mode] = G.score;
  save(); renderStage(); renderStatus();
}
function quitGame() { stopTimers(); G = null; show('games'); }

function hudHTML() {

      <textarea id="backup" aria-label="Текст резервной копии" spellcheck="false"></textarea>
      <div class="row"><button class="btn ghost small" id="b-export">Создать копию</button><button class="btn ghost small" id="b-copy">Копировать</button>
        <button class="btn ghost small" id="b-import">Восстановить</button><button class="btn danger small" id="b-reset">Сбросить прогресс</button></div>
    </div>`;
}

/* ======================= NAV + EVENTS ======================= */
let tab = 'rooms';
function show(name) {
  tab = name;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  ['rooms', 'games', 'progress'].forEach(n => { $('view-' + n).hidden = n !== name; });
  $('where').hidden = name === 'games' && !!G;
  if (name === 'rooms') renderRooms(); if (name === 'games') renderGames(); if (name === 'progress') renderProgress();
}
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tab === 'rooms') openRoom = null;
  if (G && b.dataset.tab !== 'games') { stopTimers(); G = null; }
  show(b.dataset.tab);
});
$('seg-sem').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.set.sem = Number(b.dataset.v); save(); renderStatus(); show(tab); });

document.addEventListener('click', e => {
  const play = e.target.closest('[data-play]'); if (play) return startGame(play.dataset.play, play.dataset.only || null);
  const room = e.target.closest('[data-room]'); if (room) { openRoom = room.dataset.room; renderRooms(); window.scrollTo(0, 0); return; }
  const gr = e.target.closest('[data-groom]');
  if (gr) { const id = gr.dataset.groom, i = S.set.rooms.indexOf(id); if (i >= 0) S.set.rooms.splice(i, 1); else S.set.rooms.push(id); save(); return renderGames(); }
  const opt = e.target.closest('[data-opt]'); if (opt && G) return answer(G.q.options[Number(opt.dataset.opt)]);
  const tf = e.target.closest('[data-tf]'); if (tf && G) return answer(tf.dataset.tf === '1');
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'rooms') { openRoom = null; renderRooms(); }
  else if (act === 'hide') { S.set.hide = !S.set.hide; save(); renderRooms(); }
  else if (act === 'reveal') { const f = a.closest('.formula'); f.classList.remove('veiled'); a.remove(); }
  else if (act === 'next') nextQ();
  else if (act === 'end') endGame();
  else if (act === 'stop') endGame();
  else if (act === 'again') startGame(G.mode, G.only);
  else if (act === 'quit') quitGame();
});
document.addEventListener('keydown', e => {
  if (!G || tab !== 'games' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (G.phase === 'ask') {
    if (G.q.type === 'trap') {
      if (e.key === 'ArrowLeft' || e.key === '1') { e.preventDefault(); answer(true); }
      else if (e.key === 'ArrowRight' || e.key === '2') { e.preventDefault(); answer(false); }
    } else if (e.key >= '1' && e.key <= '4') { const o = G.q.options[Number(e.key) - 1]; if (o !== undefined) answer(o); }
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (G.phase === 'wrong') { if (G.scram) endGame(); else nextQ(); }
    else if (G.phase === 'end') startGame(G.mode, G.only);
  }
});

$('view-progress').addEventListener('click', async e => {
  const id = e.target.id;
  if (id === 'b-export') { $('backup').value = JSON.stringify(S); $('backup').select(); toast('Копия создана. Скопируй текст'); }
  else if (id === 'b-copy') {
    if (!$('backup').value) $('backup').value = JSON.stringify(S);
    try { await navigator.clipboard.writeText($('backup').value); toast('Скопировано'); } catch (err) { $('backup').select(); toast('Выдели текст и скопируй вручную'); }
  } else if (id === 'b-import') {
    let data; try { data = JSON.parse($('backup').value); } catch (err) { data = null; }
    if (!valid(data)) return toast('Это не копия «Активной зоны». Вставь текст копии целиком');
    S = hydrate(data); save(); renderStatus(); renderProgress(); toast('Прогресс восстановлен');
  } else if (id === 'b-reset') {
    const b = e.target;
    if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'Нажми ещё раз, чтобы стереть всё'; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = 'Сбросить прогресс'; } }, 4000); return; }
    S = { ...S, prog: {}, log: {}, best: {} }; save(); renderStatus(); renderProgress(); toast('Прогресс стёрт');
  }
});

/* test hook */
window.__zona = { CARDS, UNITS, TIPS, schedule, state: () => S, game: () => G, gapTex,
  shiftDays(n) { dayShift += n; renderStatus(); show(tab); } };

renderStatus(); show('rooms');
})();
</script>
<!-- app:end -->
